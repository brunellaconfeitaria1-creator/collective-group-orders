<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Criar cadastro | Forever Collective</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #03050a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #070a11;
      border: 1px solid #252c3d;
      border-radius: 24px;
      padding: 32px 25px;
      box-shadow: 0 0 45px rgba(111, 32, 255, 0.18);
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #8b35ff;
    }

    .subtitle {
      color: #aab0bf;
      margin-bottom: 28px;
      font-size: 16px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #d9dce5;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      background: #0b1019;
      color: #ffffff;
      border: 1px solid #30394d;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1676ff;
      box-shadow: 0 0 0 2px rgba(22, 118, 255, 0.15);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      background: linear-gradient(90deg, #1676ff, #8c25ff);
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #cadastroMessage {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 25px;
      color: #aab0bf;
    }

    .login a {
      color: #8b35ff;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      🧬 FOREVER <span>COLLECTIVE</span>
    </div>

    <div class="subtitle">
      Crie sua conta para fazer e acompanhar seus pedidos.
    </div>

    <form id="cadastroForm">

      <label for="name">Nome completo</label>

      <input
        type="text"
        id="name"
        placeholder="Digite seu nome"
        required
      >

      <label for="phone">Telefone / WhatsApp</label>

      <input
        type="tel"
        id="phone"
        placeholder="Ex: (35) 99999-9999"
        inputmode="tel"
        required
      >

      <label for="email">E-mail</label>

      <input
        type="email"
        id="email"
        placeholder="Digite seu e-mail"
        required
      >

      <label for="password">Senha</label>

      <input
        type="password"
        id="password"
        placeholder="Crie uma senha"
        minlength="6"
        required
      >

      <button type="submit" id="signupButton">
        CRIAR CADASTRO
      </button>

    </form>

    <p id="cadastroMessage"></p>

    <div class="login">
      Já possui cadastro?
      <a href="login.html">Entrar</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://ygulvirkzwvdyfgqsbjj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2u7B7_ZvZuKc-e3UPxx3rg_5oEN83x5";

    const client =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const form =
      document.getElementById("cadastroForm");

    const message =
      document.getElementById("cadastroMessage");

    const button =
      document.getElementById("signupButton");


    form.addEventListener(
      "submit",
      async function(e) {

        e.preventDefault();

        const nome =
          document.getElementById("name")
          .value.trim();

        const telefone =
          document.getElementById("phone")
          .value.trim();

        const email =
          document.getElementById("email")
          .value.trim();

        const password =
          document.getElementById("password")
          .value;


        const numerosTelefone =
          telefone.replace(/\D/g, "");

        if (numerosTelefone.length < 10) {

          message.style.color = "#ff6b6b";

          message.textContent =
            "Digite um telefone válido.";

          return;
        }


        button.disabled = true;

        message.style.color = "#aab0bf";

        message.textContent =
          "Criando cadastro...";


        const { data, error } =
          await client.auth.signUp({

            email: email,

            password: password,

            options: {
              data: {
                nome: nome,
                telefone: telefone
              }
            }

          });


        if (error) {

          button.disabled = false;

          message.style.color = "#ff6b6b";

          message.textContent =
            "Erro: " + error.message;

          return;
        }


        message.style.color = "#54e39e";

        message.textContent =
          "Cadastro criado com sucesso!";


        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },
          1500
        );

      }
    );
  </script>

</body>

</html>
