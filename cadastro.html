<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar cadastro | Forever Collective</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:#03050a;
 color:#fff;
 font-family:Arial,sans-serif;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}

.box{
 width:100%;
 max-width:430px;
 background:#070a11;
 border:1px solid #252c3d;
 border-radius:24px;
 padding:32px 25px;
 box-shadow:0 0 45px rgba(111,32,255,.18);
}

.logo{
 font-size:28px;
 font-weight:800;
 letter-spacing:2px;
 margin-bottom:8px;
}

.logo span{color:#8b35ff}

.subtitle{
 color:#aab0bf;
 margin-bottom:28px;
 font-size:16px;
}

label{
 display:block;
 margin:15px 0 7px;
 color:#d9dce5;
 font-weight:bold;
}

input{
 width:100%;
 padding:15px;
 background:#0b1019;
 color:white;
 border:1px solid #293246;
 border-radius:12px;
 outline:none;
 font-size:16px;
}

input:focus{border-color:#7c32ff}

button{
 width:100%;
 margin-top:22px;
 padding:15px;
 border:0;
 border-radius:12px;
 color:white;
 font-size:17px;
 font-weight:bold;
 background:linear-gradient(90deg,#1676ff,#8c25f7);
 cursor:pointer;
}

#cadastroMessage{
 text-align:center;
 margin-top:15px;
}

.login{
 text-align:center;
 margin-top:25px;
 color:#aab0bf;
}

.login a{
 color:#8b35ff;
 font-weight:bold;
 text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

 <div class="logo">
 🧬 FOREVER <span>COLLECTIVE</span>
 </div>

 <div class="subtitle">
 Crie sua conta para fazer e acompanhar seus pedidos.
 </div>

 <form id="cadastroForm">

  <label for="nome">Nome completo</label>
  <input
   type="text"
   id="nome"
   placeholder="Digite seu nome"
   required
  >

  <label for="email">E-mail</label>
  <input
   type="email"
   id="email"
   placeholder="Digite seu e-mail"
   required
  >

  <label for="password">Senha</label>
  <input
   type="password"
   id="password"
   placeholder="Crie uma senha"
   required
  >

  <button type="submit">
   CRIAR CADASTRO
  </button>

 </form>

 <p id="cadastroMessage"></p>

 <div class="login">
 Já possui cadastro?
 <a href="login.html">Entrar</a>
 </div>

</div>

<script src="app.js?v=2"></script>

</body>
</html>
